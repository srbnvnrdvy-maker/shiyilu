<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾遗录 · 文物拟人战棋</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="tb-left">
      <span id="tb-title">拾遗录</span>
      <span id="tb-sub">文物拟人 · 战棋</span>
    </div>
    <div class="tb-right">
      <div class="tb-item" id="tb-lv-box" title="馆长等级">
        <span id="tb-lv">Lv.1</span>
        <div class="mini-bar"><i id="tb-axp"></i></div>
      </div>
      <div class="tb-item" title="体力（每5分钟恢复1点）">⚡ <span id="tb-stam">0</span></div>
      <div class="tb-item" title="玉璧（寻珍货币）">💠 <span id="tb-huipo">0</span></div>
      <div class="tb-item" title="古籍残页（升级道具）">📜 <span id="tb-books">0</span></div>
      <button id="btn-mute" class="icon-btn" title="音效开关">🔊</button>
    </div>
  </header>

  <!-- 主区域 -->
  <main id="main">

    <!-- 首页 -->
    <section id="screen-home" class="screen">
      <div class="home-wrap">
        <div class="home-showcase">
          <div class="showcase-ring">
            <div id="home-emoji" class="showcase-emoji">🏺</div>
          </div>
          <div id="home-name" class="showcase-name">—</div>
          <div id="home-quote" class="showcase-quote"></div>
          <div id="home-progress" class="showcase-progress"></div>
        </div>
        <div class="home-menu">
          <div class="home-head">
            <h2>博 物 馆 之 夜</h2>
            <p>子时已至，万籁俱寂。<br>文物苏醒，是为「器灵」；蚀忆之「魇」，悄然来袭。</p>
          </div>
          <button class="menu-btn" data-goto="stages"><span class="mb-icon">⚔️</span><span class="mb-text">出 征</span><span class="mb-sub">章节关卡</span></button>
          <button class="menu-btn" data-goto="chars"><span class="mb-icon">🏺</span><span class="mb-text">器 灵</span><span class="mb-sub">角色养成</span></button>
          <button class="menu-btn" data-goto="gacha"><span class="mb-icon">🔮</span><span class="mb-text">寻 珍</span><span class="mb-sub">寻访器灵</span></button>
          <button class="menu-btn" id="btn-help"><span class="mb-icon">📖</span><span class="mb-text">说 明</span><span class="mb-sub">玩法指南</span></button>
        </div>
      </div>
    </section>

    <!-- 出征（章节/关卡） -->
    <section id="screen-stages" class="screen">
      <div class="screen-head"><h2>出 征</h2><p>选择关卡，消耗体力出战。首通奖励丰厚。</p></div>
      <div id="chapter-tabs" class="chapter-tabs"></div>
      <div id="stage-list" class="stage-list"></div>
    </section>

    <!-- 器灵 -->
    <section id="screen-chars" class="screen">
      <div class="screen-head"><h2>器 灵</h2><p>点击已拥有的器灵查看详情、升级与升星。</p></div>
      <div id="char-grid" class="char-grid"></div>
    </section>

    <!-- 寻珍（抽卡） -->
    <section id="screen-gacha" class="screen">
      <div class="gacha-wrap">
        <div class="gacha-banner">
          <div class="gacha-banner-deco">🏺 🗡️ 🔔 🖼️</div>
          <h2>吉金铸史 · 常驻寻珍</h2>
          <p class="gacha-rate">特出 2% ｜ 优异 18% ｜ 常见 80%<br>十连必得优异及以上 ｜ 70次内必得特出（当前 <span id="gacha-pity">0</span>/70）</p>
          <div class="gacha-actions">
            <button class="btn btn-gold" id="btn-pull1">寻珍 ×1<br><small>💠150</small></button>
            <button class="btn btn-gold" id="btn-pull10">寻珍 ×10<br><small>💠1500</small></button>
          </div>
        </div>
        <div class="gacha-pool">
          <h3>寻珍名录</h3>
          <div id="gacha-pool-list"></div>
        </div>
      </div>
      <div id="gacha-overlay" class="gacha-overlay hidden">
        <div class="gacha-cards" id="gacha-cards"></div>
        <div class="gacha-overlay-tip" id="gacha-tip">点击任意处继续</div>
      </div>
    </section>

    <!-- 战斗 -->
    <section id="screen-battle" class="screen"></section>

  </main>

  <!-- 底部导航 -->
  <nav id="mainnav">
    <button class="nav-btn active" data-screen="home"><span>🏠</span>首页</button>
    <button class="nav-btn" data-screen="stages"><span>⚔️</span>出征</button>
    <button class="nav-btn" data-screen="chars"><span>🏺</span>器灵</button>
    <button class="nav-btn" data-screen="gacha"><span>🔮</span>寻珍</button>
  </nav>

  <!-- 通用弹窗 / 提示 -->
  <div id="modal" class="modal hidden"><div id="modal-box" class="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/battle.js"></script>
</body>
</html>
